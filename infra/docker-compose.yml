version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
  backend:
    build:
      context: ../apps/backend
    env_file:
      - ../.env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
  frontend:
    build:
      context: ../apps/frontend
    env_file:
      - ../.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
volumes:
  qdrant_storage:
